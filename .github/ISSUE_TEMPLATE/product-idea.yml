name: Build a product
description: Propose a small product; Buildkit generates specifications and asks for approvals.
title: "[Product] "
body:
  - type: markdown
    attributes:
      value: |
        Use your own product repository. Configure Actions and one provider API key first.
        Buildkit proposes scope, writes specifications and generates code for review.
        It creates a live Cloudflare Preview for review when you authorize it. Production merging and deployment occur ONLY after a separate explicit approval. Never paste credentials here.
  - type: textarea
    id: idea
    attributes:
      label: What product do you want?
      description: Who needs it, and what should the first version do?
      placeholder: A simple shared task tracker for a small team...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Anything that matters? (optional)
      description: Budget, stack, integrations, languages, privacy or explicit exclusions.
    validations:
      required: false
