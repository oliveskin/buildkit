name: Buildkit · approved infrastructure provisioning
run-name: Buildkit provision #${{ inputs.issue_number }} @${{ inputs.plan_sha }}
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Original Buildkit product Issue
        required: true
        type: string
      plan_sha:
        description: Exact resource-plan approval commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: buildkit-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.plan_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm explicit infrastructure approval and exact names
        env:
          BUILDKIT_APP_PATH: app
          BUILDKIT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          BUILDKIT_PLAN_SHA: ${{ inputs.plan_sha }}
        run: node controller/harness/provision-operation.mjs preflight
  apply:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.plan_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create ONLY approved, named preview and production resources
        env:
          BUILDKIT_APP_PATH: app
          BUILDKIT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          BUILDKIT_PLAN_SHA: ${{ inputs.plan_sha }}
          BUILDKIT_PROVISION_RESULT: provision-result/RESULT.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROVISION_TOKEN }}
        run: node controller/harness/provision-operation.mjs apply
      - uses: actions/upload-artifact@v4
        with:
          name: buildkit-resolved-resources
          path: provision-result/RESULT.json
          if-no-files-found: error
          retention-days: 14
  finalize:
    if: always() && github.ref_name == github.event.repository.default_branch
    needs: [preflight, apply]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.plan_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: needs.apply.result == 'success'
        with:
          name: buildkit-resolved-resources
          path: provision-result
      - name: Save nonsecret resource IDs or recoverable blocker; continue coding
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILDKIT_APP_PATH: app
          BUILDKIT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          BUILDKIT_PLAN_SHA: ${{ inputs.plan_sha }}
          BUILDKIT_PROVISION_JOB: ${{ needs.apply.result }}
          BUILDKIT_PROVISION_RESULT: provision-result/RESULT.json
        run: node controller/harness/provision-operation.mjs complete
