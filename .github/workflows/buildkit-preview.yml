name: Buildkit · Cloudflare Preview and browser verification
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Product issue number
        required: true
        type: string
      candidate_sha:
        description: Exact Git commit to preview
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: buildkit-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate and Cloudflare preview binding isolation
        env:
          BUILDKIT_APP_PATH: app
          BUILDKIT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          BUILDKIT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDKIT_WORKER_NAME: ${{ vars.BUILDKIT_WORKER_NAME }}
        run: node controller/harness/preview-operation.mjs preflight
      - name: Dependency install and vulnerability audit without any deployment credentials
        run: |
          test -f app/package-lock.json
          docker run --rm --network=bridge --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD/app:/workspace" -w /workspace -e CI=true node:22-bookworm-slim \
            sh -c 'npm ci --ignore-scripts --no-audit --no-fund && npm audit --omit=dev --audit-level=high'
      - name: Detect secrets in all application files
        run: |
          docker pull ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges -v "$PWD/app:/scan:ro" -w /scan ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb dir --redact --no-banner /scan
  deploy:
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.publish.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler before loading Cloudflare authorization
        run: npm install -g wrangler@4.136.3 --ignore-scripts --no-audit --no-fund
      - id: publish
        name: Publish preview only, never production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_PREVIEW_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          cd app
          wrangler preview --name "bk-issue-$ISSUE" --json --ignore-base-config > "$RUNNER_TEMP/preview.json"
          preview_url="$(jq -er '.preview.urls[0]' "$RUNNER_TEMP/preview.json")"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
  browser:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright in secret-free browser job
        run: |
          cd app
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --ignore-scripts --no-audit --no-fund --no-save @playwright/test@1.64.0
          npx playwright install --with-deps chromium
      - name: Capture desktop/mobile screenshots and execute real user journeys
        env:
          BUILDKIT_APP_PATH: app
          BUILDKIT_BROWSER_OUTPUT: preview-artifacts
          BUILDKIT_PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
          BUILDKIT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node controller/harness/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildkit-browser-evidence
          path: preview-artifacts/
          if-no-files-found: warn
  finalize:
    if: always() && github.ref_name == github.event.repository.default_branch
    needs: [preflight, deploy, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.browser.result == 'success'
        with:
          name: buildkit-browser-evidence
          path: preview-artifacts
      - name: Update branch state and post approval or blocker to issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDKIT_APP_PATH: app
          BUILDKIT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          BUILDKIT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDKIT_BROWSER_JOB: ${{ needs.browser.result }}
          BUILDKIT_PREVIEW_RESULT_PATH: preview-artifacts/result.json
          BUILDKIT_WORKER_NAME: ${{ vars.BUILDKIT_WORKER_NAME }}
        run: node controller/harness/preview-operation.mjs complete
