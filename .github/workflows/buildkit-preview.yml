name: Buildkit · Cloudflare Preview and browser verification
run-name: Buildkit preview #${{ inputs.issue_number }} @${{ inputs.candidate_sha }}
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Product issue number
        required: true
        type: string
      candidate_sha:
        description: Exact source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: buildkit-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      payload_digest: ${{ steps.package.outputs.payload_digest }}
      worker_name: ${{ steps.target.outputs.worker_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: target
        name: Validate candidate and approved HLD bindings
        env:
          BUILDKIT_APP_PATH: app
          BUILDKIT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          BUILDKIT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDKIT_WORKER_NAME: ${{ steps.target.outputs.worker_name }}
        run: node controller/harness/preview-operation.mjs preflight
      - id: package
        name: Build and verify self-contained output without deployment credentials
        env:
          BUILDKIT_APP_PATH: app
          BUILDKIT_ARTIFACT_PATH: deploy-artifact
          BUILDKIT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDKIT_WORKER_NAME: ${{ vars.BUILDKIT_WORKER_NAME }}
        run: node controller/harness/artifact.mjs build
      - name: Scan source and built output before upload
        run: |
          image=ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          docker pull "$image"
          for folder in app deploy-artifact; do
            docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges -v "$PWD/$folder:/scan:ro" -w /scan "$image" dir --redact --no-banner /scan
          done
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: buildkit-deploy-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: deploy-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      preview_url: ${{ steps.publish.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: deploy-artifact
          merge-multiple: true
      - name: Install deployment tool outside the application
        working-directory: ${{ runner.temp }}
        run: npm install -g wrangler@4.136.3 --ignore-scripts --no-audit --no-fund
      - id: publish
        name: Publish only the verified build output; no source build or npm scripts
        env:
          BUILDKIT_ARTIFACT_PATH: deploy-artifact
          BUILDKIT_ARTIFACT_DIGEST: ${{ needs.build.outputs.payload_digest }}
          BUILDKIT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDKIT_WORKER_NAME: ${{ needs.build.outputs.worker_name }}
          BUILDKIT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node controller/harness/artifact.mjs preview
  browser:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools without deployment secrets
        run: |
          cd app
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --ignore-scripts --no-audit --no-fund --no-save @playwright/test@1.64.0
          npx playwright install --with-deps chromium
      - name: Capture screenshots and real journey reports
        env:
          BUILDKIT_APP_PATH: app
          BUILDKIT_BROWSER_OUTPUT: preview-artifacts
          BUILDKIT_PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
          BUILDKIT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node controller/harness/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildkit-browser-evidence-${{ github.run_attempt }}
          path: preview-artifacts/
          if-no-files-found: warn
          retention-days: 30
  finalize:
    if: always() && github.ref_name == github.event.repository.default_branch
    needs: [build, deploy, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: needs.browser.result == 'success'
        with:
          name: buildkit-browser-evidence-${{ github.run_attempt }}
          path: preview-artifacts
      - name: Save browser result and immutable build-artifact identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDKIT_APP_PATH: app
          BUILDKIT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          BUILDKIT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILDKIT_BROWSER_JOB: ${{ needs.browser.result }}
          BUILDKIT_PREVIEW_RESULT_PATH: preview-artifacts/result.json
          BUILDKIT_EXPECTED_PREVIEW_URL: ${{ needs.deploy.outputs.preview_url }}
          BUILDKIT_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          BUILDKIT_ARTIFACT_DIGEST: ${{ needs.build.outputs.payload_digest }}
          BUILDKIT_WORKER_NAME: ${{ needs.build.outputs.worker_name }}
        run: node controller/harness/preview-operation.mjs complete
