# One-time cleanup of eight previously verified, merged Buildkit feature branches.
# Deliberately limited to this repository, exact branch SHAs, and merged PR IDs.
name: One-time merged-branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-merged-branch-cleanup.yml
permissions:
  contents: write
jobs:
  prune-merged:
    if: github.repository == 'tinmanlabsl/buildkit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the known, audited main commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_parent="$(gh api "repos/$REPO/commits/$COMMIT" --jq '.parents[0].sha')"
          test "$actual_parent" = "2bbf316b244122c863e9c0b0f412ff288007f840" || {
            echo "Main changed unexpectedly; refusing branch deletion."
            exit 1
          }
          count="$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq 'length')"
          test "$count" = "0" || { echo "Open PRs found; refusing branch deletion."; exit 1; }
      - name: Preflight all eight exact refs and merged PRs before any deletion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected pr; do
            test "$branch" != main
            actual="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
            test "$actual" = "$expected" || {
              echo "Branch advanced since audit: $branch; refusing deletion."
              exit 1
            }
            merged="$(gh api "repos/$REPO/pulls/$pr" --jq '.merged')"
            test "$merged" = "true" || {
              echo "PR #$pr is not merged; refusing deletion."
              exit 1
            }
            echo "Approved merged branch: $branch"
          done <<'BRANCHES'
          docs/github-harness-onboarding|da560615e0055071fe2438d37fc13b0fd5ace92d|2
          docs/no-local-install-prerequisites|98a0cdb4eff1aa490bde32e0c7ffa9e3dd4c7358|7
          feat/architecture-driven-build-and-provisioning|80604f2a292b429ee57447f92b7aae48de36bff5|6
          feat/evidence-security-preview-release|91a6e3933d8cca1e65bd2dc56a80603e9641b318|4
          feat/github-native-harness|324b49aa964b22674f57a723c9d89e064140294f|1
          fix/architecture-provisioning-invariants|96c994c0c8be40370167136336aca67144d916d6|8
          fix/post-transfer-audit|17fcd63996009f74034ecf162b1480074eb3f858|3
          fix/workflow-review-corrections|01ed1df08c59a0feb9205384e8ef015129b4f1cb|5
          BRANCHES
          for file in harness/run.mjs harness/research-control.mjs; do
            main_blob="$(gh api "repos/$REPO/contents/$file?ref=main" --jq '.sha')"
            feature_blob="$(gh api "repos/$REPO/contents/$file?ref=feat/architecture-driven-build-and-provisioning" --jq '.sha')"
            test "$main_blob" = "$feature_blob" || {
              echo "Post-merge feature fix missing from main: $file"
              exit 1
            }
          done
      - name: Remove only eight verified refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected pr; do
            actual="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
            test "$actual" = "$expected" || {
              echo "Branch changed during cleanup: $branch. Stopping."
              exit 1
            }
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null
            echo "Deleted merged branch $branch"
          done <<'BRANCHES'
          docs/github-harness-onboarding|da560615e0055071fe2438d37fc13b0fd5ace92d|2
          docs/no-local-install-prerequisites|98a0cdb4eff1aa490bde32e0c7ffa9e3dd4c7358|7
          feat/architecture-driven-build-and-provisioning|80604f2a292b429ee57447f92b7aae48de36bff5|6
          feat/evidence-security-preview-release|91a6e3933d8cca1e65bd2dc56a80603e9641b318|4
          feat/github-native-harness|324b49aa964b22674f57a723c9d89e064140294f|1
          fix/architecture-provisioning-invariants|96c994c0c8be40370167136336aca67144d916d6|8
          fix/post-transfer-audit|17fcd63996009f74034ecf162b1480074eb3f858|3
          fix/workflow-review-corrections|01ed1df08c59a0feb9205384e8ef015129b4f1cb|5
          BRANCHES
