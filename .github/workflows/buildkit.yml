name: Buildkit · guided product build
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing product idea issue number
        required: true
        type: number
      command:
        description: start, status, or resume (approvals belong on the issue)
        required: true
        default: status
        type: choice
        options: [start, status, resume]
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
concurrency:
  group: buildkit-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  guided-build:
    if: >-
      ((github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch &&
      (github.actor != 'github-actions[bot]' || inputs.command == 'resume')) ||
      (github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'issues' && ((github.event.action == 'labeled' && github.event.label.name == 'buildkit:idea') ||
      (github.event.action == 'opened' && startsWith(github.event.issue.title, '[Product]')))) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/')))))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned Gitleaks image before coding secrets are provided
        run: docker pull ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
      - name: Run Buildkit controller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          BUILDKIT_API_KEY: ${{ secrets.BUILDKIT_API_KEY }}
          BUILDKIT_REVIEW_API_KEY: ${{ secrets.BUILDKIT_REVIEW_API_KEY }}
          BUILDKIT_PROVIDER: ${{ vars.BUILDKIT_PROVIDER }}
          BUILDKIT_AGENT: ${{ vars.BUILDKIT_AGENT }}
          BUILDKIT_MODEL_PROVIDER: ${{ vars.BUILDKIT_MODEL_PROVIDER }}
          BUILDKIT_MODEL: ${{ vars.BUILDKIT_MODEL }}
          BUILDKIT_MODEL_FAMILY: ${{ vars.BUILDKIT_MODEL_FAMILY }}
          BUILDKIT_API_BASE_URL: ${{ vars.BUILDKIT_API_BASE_URL }}
          BUILDKIT_API_PROTOCOL: ${{ vars.BUILDKIT_API_PROTOCOL }}
          BUILDKIT_CONTEXT_TOKENS: ${{ vars.BUILDKIT_CONTEXT_TOKENS }}
          BUILDKIT_REVIEW_PROVIDER: ${{ vars.BUILDKIT_REVIEW_PROVIDER }}
          BUILDKIT_REVIEW_AGENT: ${{ vars.BUILDKIT_REVIEW_AGENT }}
          BUILDKIT_REVIEW_MODEL_PROVIDER: ${{ vars.BUILDKIT_REVIEW_MODEL_PROVIDER }}
          BUILDKIT_REVIEW_MODEL: ${{ vars.BUILDKIT_REVIEW_MODEL }}
          BUILDKIT_REVIEW_MODEL_FAMILY: ${{ vars.BUILDKIT_REVIEW_MODEL_FAMILY }}
          BUILDKIT_REVIEW_API_BASE_URL: ${{ vars.BUILDKIT_REVIEW_API_BASE_URL }}
          BUILDKIT_REVIEW_API_PROTOCOL: ${{ vars.BUILDKIT_REVIEW_API_PROTOCOL }}
          BUILDKIT_REVIEW_CONTEXT_TOKENS: ${{ vars.BUILDKIT_REVIEW_CONTEXT_TOKENS }}
          BUILDKIT_MAX_AGENT_STEPS: ${{ vars.BUILDKIT_MAX_AGENT_STEPS }}
          BUILDKIT_MAX_AGENT_CALLS: ${{ vars.BUILDKIT_MAX_AGENT_CALLS }}
          BUILDKIT_MAX_OUTPUT_TOKENS: ${{ vars.BUILDKIT_MAX_OUTPUT_TOKENS }}
          BUILDKIT_AGENT_TIMEOUT_SECONDS: ${{ vars.BUILDKIT_AGENT_TIMEOUT_SECONDS }}
          BUILDKIT_MAX_RUN_COST_USD: ${{ vars.BUILDKIT_MAX_RUN_COST_USD }}
          BUILDKIT_WORKER_NAME: ${{ vars.BUILDKIT_WORKER_NAME }}
          BUILDKIT_SEARCH_ENDPOINT: ${{ vars.BUILDKIT_SEARCH_ENDPOINT }}
          BUILDKIT_SEARCH_KEY: ${{ secrets.BUILDKIT_SEARCH_KEY }}
          BUILDKIT_SPIKE_HOSTS: ${{ vars.BUILDKIT_SPIKE_HOSTS }}
          BUILDKIT_DISPATCH_ISSUE: ${{ inputs.issue_number }}
          BUILDKIT_DISPATCH_COMMAND: ${{ inputs.command }}
        run: node harness/run.mjs
