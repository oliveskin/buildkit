name: Buildkit · approved production release
run-name: Buildkit release #${{ inputs.issue_number }} @${{ inputs.approved_sha }}
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Product Issue
        required: true
        type: string
      approved_sha:
        description: Original exact release-approved commit; unchanged on retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: buildkit-production-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.preflight.outputs.artifact_id }}
      artifact_run: ${{ steps.preflight.outputs.artifact_run }}
      payload_digest: ${{ steps.preflight.outputs.payload_digest }}
      source_sha: ${{ steps.preflight.outputs.source_sha }}
      base_branch: ${{ steps.preflight.outputs.base_branch }}
      base_sha: ${{ steps.preflight.outputs.base_sha }}
      worker_name: ${{ steps.preflight.outputs.worker_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require production configuration before any merge
        env:
          PROD_TOKEN: ${{ secrets.CLOUDFLARE_PROD_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$PROD_TOKEN" || { echo 'CLOUDFLARE_PROD_TOKEN missing'; exit 1; }
          test -n "$ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }
      - id: preflight
        name: Validate consent, separate code review and immutable artifact provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDKIT_APP_PATH: app
          BUILDKIT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          BUILDKIT_APPROVED_SHA: ${{ inputs.approved_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILDKIT_WORKER_NAME: ${{ vars.BUILDKIT_WORKER_NAME }}
        run: node controller/harness/release-operation.mjs preflight
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.preflight.outputs.artifact_run }}
          artifact-ids: ${{ steps.preflight.outputs.artifact_id }}
          path: deploy-artifact
          merge-multiple: true
      - name: Verify exact bytes previously deployed to preview
        env:
          BUILDKIT_ARTIFACT_PATH: deploy-artifact
          BUILDKIT_CANDIDATE_SHA: ${{ steps.preflight.outputs.source_sha }}
          BUILDKIT_ARTIFACT_DIGEST: ${{ steps.preflight.outputs.payload_digest }}
          BUILDKIT_WORKER_NAME: ${{ needs.verify.outputs.worker_name }}
        run: node controller/harness/artifact.mjs verify
      - name: Recheck production dependency vulnerabilities without deploy credentials
        run: |
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$PWD/app:/workspace" -w /workspace -e CI=true node:22-bookworm-slim \
            sh -c 'npm ci --ignore-scripts --no-audit --no-fund && npm audit --omit=dev --audit-level=high'
      - name: Scan source history and the built artifact
        run: |
          image=ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          docker pull "$image"
          docker run --rm --network=none -v "$PWD/app:/scan:ro" -w /scan "$image" git --redact --no-banner /scan
          for folder in app deploy-artifact; do
            docker run --rm --network=none -v "$PWD/$folder:/scan:ro" -w /scan "$image" dir --redact --no-banner /scan
          done
  merge:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      main_sha: ${{ steps.merge.outputs.main_sha }}
    steps:
      - id: merge
        name: Merge original approved head once; reuse the merge on safe retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
          APPROVED: ${{ inputs.approved_sha }}
          BASE: ${{ needs.verify.outputs.base_branch }}
          BASE_SHA: ${{ needs.verify.outputs.base_sha }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPO" --head "buildkit/issue-$ISSUE" --state all --limit 100 --json number --jq '.[0].number')"
          test -n "$pr" && test "$pr" != null
          details="$(gh api "repos/$REPO/pulls/$pr")"
          head="$(printf '%s' "$details" | jq -er '.head.sha')"
          # A dispatched run may add only controller-state metadata after release approval.
          # Verify every intervening commit leaves the approved application bytes unchanged.
          if test "$head" != "$APPROVED"; then
            delta="$(gh api "repos/$REPO/compare/$APPROVED...$head")"
            printf '%s' "$delta" | jq -e '
              .status == "ahead" and .behind_by == 0 and
              .ahead_by <= 12 and (.files | length) == 1 and
              .files[0].filename == ".buildkit/state.json" and
              .files[0].status == "modified"
            ' >/dev/null || { echo 'Unapproved code or unexpected metadata changed since release approval'; exit 1; }
          fi
          if test "$(printf '%s' "$details" | jq -r '.merged')" = true; then
            test "$head" = "$APPROVED" || test -n "$delta" || { echo 'Merged PR head is not reviewed'; exit 1; }
            main_sha="$(printf '%s' "$details" | jq -er '.merge_commit_sha')"
          else
            current_main="$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq '.object.sha')"
            test "$current_main" = "$BASE_SHA" || { echo 'Base changed: refresh preview before release'; exit 1; }
            test -n "$head" || { echo 'PR head missing'; exit 1; }
            if test "$(printf '%s' "$details" | jq -r '.draft')" = true; then gh pr ready "$pr" --repo "$REPO"; fi
            merged="$(gh api -X PUT "repos/$REPO/pulls/$pr/merge" -f sha="$head" -f merge_method=squash -f commit_title="Buildkit: approved product #$ISSUE")"
            main_sha="$(printf '%s' "$merged" | jq -er 'select(.merged == true) | .sha')"
          fi
          test "$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq '.object.sha')" = "$main_sha" || { echo 'Main advanced; refusing stale deployment'; exit 1; }
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
  deploy:
    needs: [verify, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      url: ${{ steps.publish.outputs.production_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.verify.outputs.artifact_run }}
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: deploy-artifact
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install trusted upload tool without application scripts
        working-directory: ${{ runner.temp }}
        run: npm install -g wrangler@4.136.3 --ignore-scripts --no-audit --no-fund
      - id: publish
        name: Upload the browser-reviewed artifact and verify production HTTP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILDKIT_ARTIFACT_PATH: deploy-artifact
          BUILDKIT_CANDIDATE_SHA: ${{ needs.verify.outputs.source_sha }}
          BUILDKIT_ARTIFACT_DIGEST: ${{ needs.verify.outputs.payload_digest }}
          BUILDKIT_WORKER_NAME: ${{ needs.verify.outputs.worker_name }}
        run: node controller/harness/artifact.mjs production
  domain:
    needs: [verify, merge, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ needs.merge.outputs.main_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attach only the previously approved custom hostname after verified deployment
        env:
          BUILDKIT_APP_PATH: app
          BUILDKIT_APPROVED_SHA: ${{ inputs.approved_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node controller/harness/domain-operation.mjs
  finalize:
    if: always() && github.ref_name == github.event.repository.default_branch
    needs: [verify, merge, deploy, domain]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: buildkit/issue-${{ inputs.issue_number }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Persist outcome without changing the approved deployment request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDKIT_APP_PATH: app
          BUILDKIT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          BUILDKIT_APPROVED_SHA: ${{ inputs.approved_sha }}
          BUILDKIT_DEPLOY_STATUS: ${{ needs.deploy.result == 'success' && needs.domain.result == 'success' && 'success' || 'failure' }}
          BUILDKIT_DEPLOY_MAIN_SHA: ${{ needs.merge.outputs.main_sha }}
          BUILDKIT_PRODUCTION_URL: ${{ needs.deploy.outputs.url }}
        run: node controller/harness/release-operation.mjs finalize
