name: Buildkit harness tests
on:
  push:
    branches: [main]
    paths:
      - 'harness/**'
      - '.github/ISSUE_TEMPLATE/product-idea.yml'
      - '.github/workflows/harness-tests.yml'
  pull_request:
    paths:
      - 'harness/**'
      - '.github/workflows/buildkit.yml'
      - '.github/ISSUE_TEMPLATE/product-idea.yml'
      - '.github/workflows/harness-tests.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check harness/core.mjs
      - run: node --check harness/run.mjs
      - run: node --test harness/core.test.mjs
      - name: Validate GitHub issue form schema
        run: |
          ruby -ryaml -e 'd = YAML.load_file(".github/ISSUE_TEMPLATE/product-idea.yml"); raise "Invalid issue form" unless d.is_a?(Hash) && d["name"].is_a?(String) && d["description"].is_a?(String) && d["body"].is_a?(Array) && d["body"].any? { |x| x["type"] == "textarea" }'


