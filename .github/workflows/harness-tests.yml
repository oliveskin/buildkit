name: Buildkit harness tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and offline regression tests
        run: |
          for file in harness/*.mjs; do node --check "$file"; done
          node --test harness/*.test.mjs
      - name: Validate GitHub YAML including duplicate keys
        run: ruby scripts/validate-workflows.rb
      - name: Run open-source Gitleaks on full Git history and working tree
        run: |
          docker pull ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges -v "$PWD:/scan:ro" -w /scan ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb git --redact --no-banner /scan
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges -v "$PWD:/scan:ro" -w /scan ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb dir --redact --no-banner /scan
      - name: Real isolated npm execution (fake AI and GitHub; no API spend)
        env:
          BUILDKIT_TEST_REAL_DOCKER: '1'
        run: node --test --test-name-pattern='complete approval flow' harness/flow.test.mjs
  opencode-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned CLI without model or deployment credentials
        working-directory: ${{ runner.temp }}
        run: npm install -g opencode-ai@1.19.0
      - name: Validate actual configuration and noninteractive CLI (no inference)
        env:
          BUILDKIT_TEST_OPENCODE: '1'
        run: node --test harness/model-cli.test.mjs
